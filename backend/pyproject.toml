[project]
name = "interview-expert"
version = "0.1.0"
description = "AI 模拟面试系统（算法岗实习/校招方向）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "openai>=1.40.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.8.0",
    "python-multipart>=0.0.9",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.2",
    "websockets>=12.0",
    "bcrypt>=4.0.0",
    "pyjwt>=2.8.0",
]

[project.optional-dependencies]
# 仅当 VOICE_PROVIDER=aliyun 时需要（火山引擎走纯 WebSocket，无需 SDK）
aliyun = ["dashscope>=1.20.0"]

[tool.uv]
package = false

# 国内镜像：服务器/本地网络访问 pypi.org 不稳时显著提速
[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
